services:
  - type: web
    name: luka-frontend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: "production"
      - key: APP_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: ENABLE_MOCK_AUTH
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: LUKA_BACKEND_URL
        sync: false
      - key: FLOW_ADMIN_API_KEY
        sync: false
      - key: FLOW_ADMIN_AUTH_USER_IDS
        sync: false
