services:
  - type: web
    name: luka-frontend
    env: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MOCK_WHATSAPP_ID
        sync: false
      - key: LUKA_BACKEND_URL
        sync: false
      - key: FLOW_ADMIN_API_KEY
        sync: false
      - key: FLOW_ADMIN_AUTH_USER_IDS
        sync: false
