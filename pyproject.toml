[project]
name = "luka-frontend-cloudflare-spike"
version = "0.1.0"
description = "Cloudflare Workers Free migration spike for Luka Frontend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.115.5",
    "httpx==0.27.2",
    "itsdangerous==2.2.0",
    "jinja2==3.1.4",
    "psycopg==3.3.4",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.12",
    "sqlalchemy==2.0.36",
    "supabase==2.31.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.3",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["python_modules", ".venv-workers"]

[tool.ruff.lint.isort]
known-third-party = ["workers"]
